# Tests plus the security gate: SAST (gosec here, CodeQL in codeql.yml), SCA (govulncheck and Trivy over go.mod),
# secrets (gitleaks), Dockerfile misconfiguration (Trivy), and a Trivy scan of the built image.
# Runs on pull requests and once a week (new CVEs land without any code change), and is called by publish.yml as
# the gate in front of every release, so a push to main runs it exactly once.
# Results go to the repository's Security tab (code scanning) as well as failing the job.
#
# What fails the build:
#   - gofmt / go vet / staticcheck / go test -race / build failures
#   - the browser tests (e2e) and the real-Docker integration test
#   - govulncheck: a known vulnerability that the code actually reaches
#   - gosec: a finding at medium severity and confidence or above. A justified exception is a
#     `#nosec Gxxx -- reason` comment on the statement, reviewed like any other change.
#   - gitleaks: any secret in the git history
#   - Trivy (repo, and the amd64 and arm64 images): a fixable HIGH or CRITICAL. Unfixed ones are reported, not enforced.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"   # Mondays; catches CVEs published since the last push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod   # uses the toolchain line, so CI builds with the same patched Go as the image
      - run: go mod download && go mod verify
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "Not gofmt-formatted:"; gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...   # staticcheck.conf holds the one disabled check
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - name: dashboard JS parses
        run: for f in internal/web/static/*.js; do node --check "$f" || exit 1; done
      # go test above already runs it; named here so a duplicate id fails visibly.
      - name: no duplicate ids in the page templates
        run: go test -count=1 -run 'TestTemplates_NoDuplicateIDs|TestPages_SharedLayoutAndUniqueIDs' ./internal/web

  e2e:
    name: browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # The dashboard (real code, fake docker) runs as a Go test on the runner; the browser is the official
      # Playwright image, so nothing is installed on the host. See e2e/README.md.
      - run: CI=1 ./e2e/run-docker.sh

  integration:
    name: real Docker (guard + client + a tiny image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # The runner's own daemon: creates, starts and stops a busybox container through the scoped guard, and checks
      # the guard refuses an image, bind, network, name or security option outside the scope.
      - run: go test -tags integration -count=1 -v ./internal/integration

  compose:
    name: example compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: |
          cp compose.yaml.example compose.yaml
          cp .env.example .env
          docker compose config -q
          for p in windrose valheim palworld; do docker compose --profile "$p" config -q; done

  sast-sca:
    name: SAST + SCA (gosec, govulncheck, gitleaks, Trivy fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0}   # gitleaks scans the whole history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: govulncheck (SCA, reachability-aware)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: gosec (SAST)
        id: gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet -severity medium -confidence medium \
            -fmt sarif -out gosec.sarif -stdout -verbose text ./...
      - name: Upload gosec results
        if: ${{ always() && hashFiles('gosec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with: {sarif_file: gosec.sarif, category: gosec}

      - name: gitleaks (secrets, full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .

      - name: Trivy fs (dependencies, Dockerfile/compose misconfig, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true
      - name: Upload Trivy fs results
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with: {sarif_file: trivy-fs.sarif, category: trivy-fs}

  image:
    name: container image scan (Trivy, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]   # the release publishes both, so both are scanned
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}   # Go cross-compiles natively; only the final stage's apk steps run under QEMU
          tags: crowsnest:ci
      - name: Trivy image (a fixable HIGH or CRITICAL fails, as it would at release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: crowsnest:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image-${{ matrix.arch }}.sarif
          limit-severities-for-sarif: true
      - name: Upload Trivy image results
        if: ${{ always() && hashFiles(format('trivy-image-{0}.sarif', matrix.arch)) != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: trivy-image-${{ matrix.arch }}.sarif
          category: trivy-image-${{ matrix.arch }}
      - name: Full report (all severities, informational)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: crowsnest:ci
          format: table
          skip-setup-trivy: true
