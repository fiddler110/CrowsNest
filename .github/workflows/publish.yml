# Publishes ghcr.io/<owner>/crowsnest and cuts a GitHub Release.
#
# Every push to main:
#   1. runs ci.yml (tests + SAST/SCA + image scan) as the gate;
#   2. computes the next version from the commit messages in the push:
#        default -> patch      "#minor" -> minor      "#major" -> major      "[skip release]" -> :dev only
#   3. builds the image for the runner's arch and scans it with Trivy BEFORE pushing (a fixable HIGH/CRITICAL
#      stops the release);
#   4. pushes a multi-arch image (amd64, arm64) with SBOM + max-mode provenance, tagged :X.Y.Z, :X.Y, :latest,
#      :sha-<short> and :dev, signs it keyless with cosign and records a build-provenance attestation;
#   5. creates the GitHub Release vX.Y.Z with generated notes.
# A hand-pushed v* tag publishes that version (no second release). See docs/publishing.md.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; exit 0; fi
          latest=$(git -c versionsort.suffix=-rc tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          if git tag --points-at HEAD | grep -q '^v'; then echo "HEAD is already released"; exit 0; fi
          if [ -n "$BEFORE" ] && ! [ "$BEFORE" = 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            msgs=$(git log --format=%B "$BEFORE..HEAD")
          else
            msgs=$(git log -1 --format=%B)
          fi
          if grep -qiF '[skip release]' <<<"$msgs"; then echo "[skip release] found"; exit 0; fi
          ver=${latest#v}; ver=${ver:-0.0.0}; base=${ver%%-*}
          IFS=. read -r maj min pat <<<"$base"
          if grep -qi '#major' <<<"$msgs"; then maj=$((maj+1)); min=0; pat=0
          elif grep -qi '#minor' <<<"$msgs"; then min=$((min+1)); pat=0
          else pat=$((pat+1))
          fi
          echo "tag=v$maj.$min.$pat" >> "$GITHUB_OUTPUT"

  image:
    needs: [ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io/<owner>/crowsnest
      id-token: write        # keyless signing with cosign
      attestations: write    # build provenance
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/crowsnest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.tag != '' && !contains(needs.version.outputs.tag, '-') }}
            type=sha
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.title=crowsnest
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}

      # Build once for the runner's architecture and scan it BEFORE anything is pushed; a fixable HIGH/CRITICAL
      # stops the release.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: scan-me:latest
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: scan-me:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      # GitHub offers attestations only for public repositories (and organisation plans).
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    # Only after the image was gated, scanned, pushed and signed, so a tag never points at a build that failed.
    needs: [version, image]
    if: ${{ github.ref_type == 'branch' && needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
            --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crowsnest:${TAG#v}\` (also \`:latest\`)"
          # The quickstart, pinned to this release, so a download never drifts to whatever is newest.
          ver=${TAG#v}
          sed -i "s/^CROWSNEST_TAG=.*/CROWSNEST_TAG=${ver}/" quickstart/.env.example
          tar -czf quickstart.tar.gz --transform 's,^quickstart,crowsnest-quickstart,' quickstart
          gh release upload "$TAG" quickstart.tar.gz --repo "$GITHUB_REPOSITORY"
