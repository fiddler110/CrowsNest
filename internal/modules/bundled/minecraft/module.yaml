api_version: 1
id: minecraft
name: Minecraft
accent: "#4ade80"
description: "Java edition server (itzg/minecraft-server): vanilla, Paper, Fabric or Forge. Needs the EULA accepted. Saves the world on stop; backups pause writes over RCON."
# Java edition, itzg/minecraft-server (vanilla, Paper, Fabric and Forge print the
# same vanilla server lines). Everything here is declarative: no Go code.
# Markers are the standard server log lines; see
# internal/modules/testdata/minecraft_session.log. Chat lines look like
# "<Name> text" and never match because the name must follow "INFO]: " directly.
#
# Optional raw console: the image enables RCON (Source protocol) by default.
# Set rcon_addr (host:port, e.g. minecraft:25575) and rcon_password_env to use it.

runtime:
  ram: 3g                # typical use; admission swaps in the measured peak after a run
  image: itzg/minecraft-server
  stop_grace: 60s           # the image saves the world on SIGTERM
  data_dir: Minecraft
  ports:
    - {port: 25565, proto: tcp, why: "Java Edition players connect here"}   # RCON (25575) stays on the games network, unpublished
  data:
    - {path: /data}
  env:
    - EULA=${eula}
    - TYPE=${server_type}
    - VERSION=${version}
    - MEMORY=${memory}
    - MOTD=${motd}
    - MAX_PLAYERS=${max_players}
    - DIFFICULTY=${difficulty}
    - ENABLE_RCON=true
    - RCON_PASSWORD=${rcon_password}

backup:
  # Pause world writes over RCON (the image enables it), archive the world, resume. save-on always runs.
  exec: ["/bin/sh", "-c", "mkdir -p /data/backups && rcon-cli save-off >/dev/null; rcon-cli save-all flush >/dev/null; tar czf /data/backups/manual-$(date +%Y%m%d-%H%M%S).tar.gz -C /data world; s=$?; rcon-cli save-on >/dev/null; exit $s"]
  list_dir: /data/backups
  before_stop: true

options:
  - {key: eula, label: "Accept the Minecraft EULA (https://aka.ms/MinecraftEULA): TRUE to accept", default: "FALSE"}
  - {key: server_type, label: "Server software: VANILLA, PAPER, FABRIC, FORGE...", default: VANILLA}
  - {key: version, label: "Minecraft version (LATEST for the newest)", default: LATEST}
  - {key: memory, label: Java heap, default: 2G}
  - {key: motd, label: Message of the day, default: A CrowsNest Minecraft server}
  - {key: max_players, label: Max players, default: "10"}
  - {key: difficulty, label: "peaceful, easy, normal or hard", default: normal}
  - {key: rcon_password, label: RCON password (same value as the env var named in rcon_password_env), secret: true}
  - {key: rcon_addr, label: "RCON host:port (enables the raw console)", derive: "{id}:25575"}
  - {key: rcon_password_env, label: "Env var holding the RCON password", default: MINECRAFT_RCON_PASSWORD}

status:
  ready_log: 'Done \([0-9.]+s\)! For help, type "help"'
players:
  type: log_markers
  join: 'INFO\]: (\S+) joined the game\s*$'
  leave: 'INFO\]: (\S+) left the game\s*$'
  world: 'Preparing level "([^"]+)"'

rcon:
  addr: ${rcon_addr}
  password_env: ${rcon_password_env}

startup:
  - {match: 'Starting minecraft server version', pct: 30, label: Starting server}
  - {match: 'Preparing level', pct: 60, label: Loading world}
  - {match: 'Preparing spawn area', pct: 85, label: Preparing spawn area}
  - {match: 'Done \([0-9.]+s\)! For help', pct: 100, label: Server ready}
