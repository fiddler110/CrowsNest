api_version: 1
id: valheim
name: Valheim
description: "Valheim dedicated server (lloesche/valheim-server) with its own world backups and status port."
# Markers verified 2026-11-07 against a real player session
# (internal/logtrack/testdata/valheim_session.log).
runtime:
  image: lloesche/valheim-server
  stop_grace: 2m            # saves the world on SIGTERM
  data_dir: Valheim
  ports:
    - {port: 2456, proto: udp}
    - {port: 2457, proto: udp}
  data:
    - {sub: config, path: /config}
    - {sub: data, path: /opt/valheim}
  env:
    - SERVER_NAME=${server_name}
    - WORLD_NAME=${world_name}
    - SERVER_PASS=${server_pass}      # the image needs 5+ characters
    - SERVER_PUBLIC=${server_public}
    - BACKUPS_MAX_AGE=${backups_max_age}

backup:
  exec: ["/bin/sh", "-c", "mkdir -p /config/backups && tar czf /config/backups/manual-$(date +%Y%m%d-%H%M%S).tar.gz -C /config worlds_local"]
  list_dir: /config/backups
  before_stop: true

options:
  - {key: server_name, label: Server name, default: My Valheim Server}
  - {key: world_name, label: World name, default: Midgard}
  - {key: server_pass, label: Join password (5+ characters), secret: true}
  - {key: server_public, label: List in the server browser, default: "false"}
  - {key: backups_max_age, label: Days of automatic world backups to keep, default: "3"}

status:
  ready_log: 'Loading: Done\.|Opened Steam server'
players:
  type: log_markers
  join: 'Got handshake from client (\S+)'
  leave: 'Closing socket (\S+)'
  world: 'Load world:\s*(.+?)\s*$'
startup_progress:
  match: 'Update state \(0x61\) downloading, progress: (\d+(?:\.\d+)?)'
  from: 10
  to: 70
  label: 'Downloading server files ({pct}%)'
startup:
  - {match: 'Downloading/updating/validating Valheim server', pct: 5, label: Checking for updates}
  - {match: 'Zonesystem Awake', pct: 72, label: Starting server}
  - {match: 'Load world:', pct: 80, label: Loading world}
  - {match: 'Loading: Generating locations', pct: 88, label: Generating world}
  - {match: 'Loading: Done\.|Opened Steam server', pct: 100, label: Server ready}
