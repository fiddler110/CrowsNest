# CrowsNest quickstart: the panel, plus a guard that keeps it away from the raw Docker socket.
# No games are set up here: add them from the Games page once you are signed in.
#
#   panel ---> guard ---> /var/run/docker.sock
#
# The panel can only reach the guard (an internal network), and the guard only does what policy/policy.yaml
# allows. The guard also runs the exec allowlist (`--exec`), which only matters once a game has a backup
# command and the policy turns exec on. Read README.md in this folder first.
name: crowsnest

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  crowsnest:
    <<: *hardening
    image: ghcr.io/fiddler110/crowsnest:${CROWSNEST_TAG:-latest}
    container_name: crowsnest
    depends_on: [guard]
    ports:
      - "${CROWSNEST_BIND:-127.0.0.1}:5000:5000"   # put HTTPS in front before exposing it beyond this machine
    environment:
      - TZ=${TZ:-UTC}
      - DOCKER_CONFIG=/tmp/.docker
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 256
    mem_limit: 512m
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data                         # users, session secret, settings, activity log, dashboard games
      - ./policy:/etc/crowsnest/policy:ro        # the limits the dashboard cannot change
      # Shared backups folder (optional, see docs/backups.md): one sub-folder per game, so three servers of
      # one game keep three sets. Point BACKUPS_DIR at an external drive if you like. Read-write.
      # - ${BACKUPS_DIR:?set BACKUPS_DIR in .env to an absolute path}:/game-backups
    networks: [crowsnest-docker, crowsnest-games-net]

  # The scoped Docker API filter: creates, starts and sees only what policy.yaml admits. With --exec it also
  # runs the exec allowlist in front of itself (same process, so no second container): docker exec is refused
  # unless the policy allows it and the command is one a game's module declares for backups.
  # Refusals: docker logs dockerproxy-crowsnest 2>&1 | grep DENY
  guard:
    <<: *hardening
    image: ghcr.io/fiddler110/crowsnest:${CROWSNEST_TAG:-latest}
    container_name: dockerproxy-crowsnest
    hostname: dockerproxy-crowsnest
    command: ["guard", "--listen", ":2375", "--exec"]
    user: "1000"
    group_add: ["${DOCKER_GID:-999}"]
    tmpfs: [/tmp]
    environment:
      - GUARD_SCOPES_FILE=/etc/crowsnest/managed/scopes.json
      - GUARD_POLICY=/etc/crowsnest/policy/policy.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 60s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.yaml:/app/config.yaml:ro        # for the exec allowlist
      - ./data/managed:/etc/crowsnest/managed:ro
      - ./data/managed:/app/data/managed:ro      # the same folder where config.yaml says it is
      - ./policy:/etc/crowsnest/policy:ro
    networks: [crowsnest-docker]

networks:
  crowsnest-docker:   # panel <-> guard only
    internal: true
  crowsnest-games-net:   # the panel and every game it starts
    name: crowsnest-games-net
