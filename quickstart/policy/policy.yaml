# The limits the dashboard works inside. The guard enforces them; the panel cannot change them.
# Widen them here, on the host, deliberately. See ../../docs/modules.md ("The policy envelope").
# Every list is required: no limit is ever implied.
games_root: /srv/games                  # game data may only be bound from inside this folder (a host path)
# No "names" list: any name works, and the guard only manages containers this dashboard created.
images: [lloesche/valheim-server, thijsvanloef/palworld-server-docker, "docker.io/itzg/*"]   # image repositories you trust
networks: [crowsnest-games-net]
ports: ["25000-28999/udp", "25565/tcp", "2456-2458/udp", "8211/udp"]
host_ips: []
exec: false                             # true lets games run the backup command declared in their module
pin_digests: true                       # run images by digest so an upstream push changes nothing until you update
max_scopes: 16
