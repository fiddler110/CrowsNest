# The limits the dashboard works inside. The guard enforces them; the panel cannot change them.
# Widen them here, on the host, deliberately. See ../../docs/modules.md ("The policy envelope").
games_root: /srv/games                  # game data may only be bound from inside this folder (a host path)
# ports: ["8200-8299/udp", "25560-25599/tcp", "2456-2499/udp"]   # optional: room for a second or third server of a game
#                                       # (the next free port in these ranges is picked for you)
host_ips: []
exec: false                             # true lets games run the backup command declared in their module
pin_digests: true                       # run images by digest so an upstream push changes nothing until you update
max_scopes: 16

# Not listed, so these are the defaults:
#   ports:    the published ports of each game you switch on under "Add a game" (a password is asked)
#   images:   the images the bundled modules declare (written "@modules"). To add your own, list it too:
#             images: ["@modules", "ghcr.io/you/mygame"]
#   networks: the games network from config.yaml (platform.games_network)
#   names:    any name; the guard only manages containers this dashboard created
